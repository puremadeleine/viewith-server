spring:
  application:
    name: viewith-server

  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:tcp://localhost/~/viewith-db;MODE=MySQL
    username: sa
    password:
  sql:
    init:
      mode: always

  jpa:
    hibernate:
      ddl-auto: create
    properties:
      hibernate:
        #        show_sql: true
        format_sql: true
    defer-datasource-initialization: true

  jackson:
    property-naming-strategy: SNAKE_CASE

logging:
  level:
    org.hibernate.SQL: debug
    org.hibernate.type: trace
    com.puremadeleine.viewith.repository.client: debug
    feign: debug

feign:
  client:
    config:
      default:
        loggerLevel: FULL


kakao:
  oauth:
    uri: https://kauth.kakao.com
  api:
    uri: https://kapi.kakao.com

security:
  exclude-uris:
    - /
    - /health
    - /v1
    - /v1/members/login/*
    - /v1/members/refresh
    - /v1/reviews/list
    - /v1/reviews/*
    - /v1/help/**
    - /v1/performances/search
    - /v1/venues
    - /v1/venues/*
    - /v1/venues/*/filter
