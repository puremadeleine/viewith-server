spring:
  application:
    name: viewith-server

  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
    database-platform: org.hibernate.dialect.MySQLDialect

  jackson:
    property-naming-strategy: SNAKE_CASE

logging:
  level:
    org.hibernate.SQL: debug
    org.hibernate.type: trace
    org.springframework.security: debug
    feign: debug

kakao:
  oauth:
    uri: https://kauth.kakao.com
  api:
    uri: https://kapi.kakao.com

security:
  exclude-uris:
    - /
    - /health
    - /v1
    - /v1/members/login/*
    - /v1/members/refresh
    - /v1/reviews/list
    - /v1/help/**
    - /v1/performances/search
    - /v1/venues
    - /v1/venues/*
    - /v1/venues/*/filter
