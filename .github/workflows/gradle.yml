name: Java CI/CD with Gradle

on:
  push:
    branches:
      - main
      - develop
      - ci-cd-test
  pull_request:
    branches:
      - main
      - develop

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execution permission
        run: chmod +x ./gradlew

      - name: Create application-private.yml
        run: |
          ls -al

      - name: Build with Gradle Wrapper
        run: ./gradlew build

      - name: List built files
        run: |
          ls -R build/libs
          ls -R src/main/resources
          cat src/main/resources/application-private.yml
        
      - name: Upload build artifacts (JAR)
        uses: actions/upload-artifact@v4
        with:
          name: viewith
          path: build/libs/viewith-server-0.0.1-SNAPSHOT.jar

  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download JAR artifact
        uses: actions/download-artifact@v4
        with:
          name: viewith
          path: build/libs/

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Test SSH Connection
        run: |
          echo "${{ secrets.AWS_EC2_SSH_KEY }}" > private_key.pem
          chmod 600 private_key.pem
          ssh -o StrictHostKeyChecking=no -i private_key.pem ${{ secrets.AWS_EC2_USER }}@${{ secrets.AWS_EC2_HOST }} "echo 'Connected successfully'"

      - name: Upload JAR
        run: |
          echo "${{ secrets.AWS_EC2_SSH_KEY }}" > private_key.pem
          chmod 600 private_key.pem
          scp -i private_key.pem -o StrictHostKeyChecking=no build/libs/viewith-server-0.0.1-SNAPSHOT.jar ${{ secrets.AWS_EC2_USER }}@${{ secrets.AWS_EC2_HOST }}:/home/${{ secrets.AWS_EC2_USER }}/deploy/viewith-server.jar
          ssh -i private_key.pem -o StrictHostKeyChecking=no ${{ secrets.AWS_EC2_USER }}@${{ secrets.AWS_EC2_HOST }} "pgrep java | xargs kill -9; nohup java -jar /home/${{ secrets.AWS_EC2_USER }}/deploy/viewith-server.jar --spring.profiles.active=prod --server.port=8081  > app.log 2>&1 &"
      
